name: Apex Scan

on: push

default_branch: main

jobs:
  apex_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Apex Scan
        env:
          SCAN_TARGET: ${{ github.event.pull_request.head.repo.full_name }}
        run: | 
          echo "Running Apex Scan on target: $SCAN_TARGET"
          python /path/to/your/apex_scanner.py --target "$SCAN_TARGET"
